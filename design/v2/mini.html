<!doctype html>
<html lang="zh-CN" data-theme="celadon"><head><meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="v2.css">
<style>html,body{margin:0;background:transparent}body{display:block}</style>
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 7h10.5M8.5 12h10.5M8.5 17h10.5M5 7h.01M5 12h.01M5 17h.01"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4.5 20 9l-8 4.5L4 9l8-4.5Z"/><path d="M4 14l8 4.5 8-4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.6 4.2 4.2L18.8 7.7"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 8h9a3 3 0 0 1 0 6h-1"/><path d="m9.5 5.5L7 8l2.5 2.5"/><path d="M17 16H8a3 3 0 0 1 0-6h1"/><path d="m14.5 18.5L17 16l-2.5-2.5"/></symbol>
</svg>

<div class="win win--mini">
  <div class="mini-head">
    <svg class="mark" width="19" height="19" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <circle cx="32" cy="32" r="18.4" stroke="currentColor" stroke-width="4.8"/>
  <path d="M32 32 40.5 23.5" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="43.7" cy="20.3" r="6.8" fill="var(--accent)"/>
</svg>
    <b>到点</b>
    <span class="date">10月23日 周四</span>
  </div>

  <div class="mini-title">
    <h1>今天</h1>
    <span class="today-fig">2 / 7</span>
    <span class="grow"></span>
    <span style="font-size:10.5px;color:var(--ink-4)">09:23</span>
  </div>

  <div class="mini-add">
    <div class="mini-add__line">
      <span class="mini-add__dot"></span>
      <span class="mini-add__ph">记一件…</span>
      <button class="mini-add__go"><svg class="ico" style="width:13px;height:13px"><use href="#i-plus"/></svg></button>
    </div>
    <div class="mini-add__row">
      <span class="chip on">今天 15:00</span>
      <span class="chip">明天 9 点</span>
      <span class="chip">自选</span>
    </div>
  </div>

  <div class="mini-scroll">
    <div class="mini-group"><h2>逾期</h2><i>1</i><span class="rule"></span></div>
    <div class="mini-list">
      
<div class="r overdue">
  <span class="r__c"></span>
  <div>
    <div class="r__t">把昨天的测试结果发群里</div>
    <div class="r__m red">逾期 53 分钟</div>
  </div>
  <span class="r__s">08:30</span>
</div>
    </div>

    <div class="mini-group"><h2>今天</h2><i>3</i><span class="rule"></span></div>
    <div class="mini-list">
      
<div class="r soon">
  <span class="r__c"></span>
  <div>
    <div class="r__t">站会同步进度</div>
    <div class="r__m amber">1 小时后</div>
  </div>
  <span class="r__s">10:30</span>
</div>
      
<div class="r">
  <span class="r__c"></span>
  <div>
    <div class="r__t"><span class="pin"></span>提测评审</div>
    <div class="r__m">1.2 版本 · 阶段 2/4</div>
  </div>
  <span class="r__s">14:00</span>
</div>
      
<div class="r">
  <span class="r__c"></span>
  <div>
    <div class="r__t">交周报</div>
    
  </div>
  <span class="r__s">18:00 <svg class="ico" style="width:11px;height:11px;vertical-align:-1px"><use href="#i-repeat"/></svg></span>
</div>
    </div>

    <div class="mini-group"><h2>没定时间</h2><i>1</i><span class="rule"></span></div>
    <div class="mini-list">
      
<div class="r">
  <span class="r__c"></span>
  <div>
    <div class="r__t">整理这周的需求变更</div>
    
  </div>
  <span class="r__s">—</span>
</div>
    </div>
  </div>

  <div class="mini-foot">
    <button class="tab on"><svg class="ico"><use href="#i-list"/></svg>待办</button>
    <button class="tab"><svg class="ico"><use href="#i-layers"/></svg>计划</button>
    <button class="tab"><svg class="ico"><use href="#i-check"/></svg>已完成</button>
    <button class="icon-btn"><svg class="ico"><use href="#i-moon"/></svg></button>
  </div>
</div>
</body></html>
