<!doctype html>
<html lang="zh-CN" data-theme="celadon"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/styles.css">
<style>body{background:var(--bg);padding:30px;width:420px;height:300px;margin:0}
 .remind{position:static;margin:0 auto}</style>
</head><body>
<div class="remind">
  <div class="remind__dial">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="18.4" stroke="currentColor" stroke-width="4.8"/>
      <path d="M32 32 40.5 23.5" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/>
    </svg>
    <span class="remind__bead is-landed"></span>
    <span class="remind__ring"></span>
  </div>
  <div class="remind__main">
    <div class="remind__cap"><svg class="ico s"><use href="#i-bell"/></svg><span>到点</span><time>14:00</time>
      <button class="icon-btn" type="button"><svg class="ico s"><use href="#i-x"/></svg></button></div>
    <h3>提测评审</h3>
    <p class="remind__detail">1.2 版本 · 阶段 2/4</p>
    <div class="remind__acts">
      <button class="btn btn--sm btn--primary">完成</button>
      <button class="btn btn--sm">稍后 10 分钟</button>
    </div>
    <div class="remind__rail">
      <span class="remind__line"></span>
      <span class="remind__tick" style="left:33.33%"><b>10 分钟</b></span>
      <span class="remind__tick is-near" style="left:66.66%"><b>30 分钟</b></span>
      <span class="remind__tick" style="left:100%"><b>1 小时</b></span>
      <button class="remind__knob" style="left:180px"></button>
    </div>
    <p class="remind__hint">松手推后 30 分钟</p>
  </div>
</div>
<svg style="display:none">
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.6 9.6a5.4 5.4 0 0 1 10.8 0c0 3.6 1.3 4.9 1.3 4.9H5.3s1.3-1.3 1.3-4.9Z"/><path d="M10 18.3a2.1 2.1 0 0 0 4 0"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
</svg>
</body></html>
