<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EBF0ED;--card:#FAFCFB;--ink:#0E1613;--ink2:#47564F;--ink3:#74847C;--ink4:#98A69F;
  --line:#D3DFD9;--line2:#E3EBE6;--acc:#15637B;--acc-soft:#DCE9EF;--fill:#E1E8E4;--fill2:#CCD8D2;
  --warn:#9C640E;--warn-soft:#F3E7D1;--done:#2C7A58;--danger:#A33C3C;
  --sans:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Songti SC",SimSun,serif;
}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:var(--sans);color:var(--ink)}
.win{width:380px;height:760px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.hd svg{width:19px;height:19px;color:var(--ink2)}
.hd b{font-family:var(--serif);font-size:14.5px;font-weight:500;letter-spacing:.14em}
.hd time{margin-left:auto;font-size:10.5px;color:var(--ink4)}
.title{display:flex;align-items:baseline;gap:7px;padding:2px 14px 10px}
.title h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.title span{font-size:10.5px;color:var(--ink4);font-family:var(--serif)}
.title time{margin-left:auto;font-size:10.5px;color:var(--ink4);font-family:var(--serif)}

.add{margin:0 12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px 7px}
.add__row{display:flex;align-items:center;gap:7px;height:24px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--fill2);flex:none}
.add__ph{font-size:12.5px;color:var(--ink4);flex:1}
.add__go{width:24px;height:24px;border-radius:7px;background:var(--acc);color:#fff;display:grid;place-items:center;border:0;flex:none;font-size:14px}
.add__chips{display:flex;gap:5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.ch{height:24px;padding:0 9px;border-radius:999px;background:var(--fill);font-size:11px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ch.on{background:var(--acc-soft);color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px rgba(21,99,123,.2)}

.tools{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
.tools .ch{height:24px}
.tools .grow{flex:1}

.list{flex:1;overflow:hidden;padding:0 12px 8px;display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px 9px}
.pcard__top{display:flex;align-items:center;gap:6px}
.pin{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:none}
.pcard__top h3{font-size:13.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.more{width:22px;height:22px;border:0;background:transparent;color:var(--ink4);font-size:14px;line-height:1;flex:none;border-radius:6px}
.pcard__meta{display:flex;align-items:center;gap:8px;margin-top:3px;padding-left:11px}
.pcard__meta .note{font-size:10.5px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard__meta .frac{font-size:10px;color:var(--ink4);font-family:var(--serif);flex:none}
.bar{height:3px;border-radius:2px;background:var(--fill);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:2px}
.steps{list-style:none;display:flex;flex-direction:column;gap:1px}
.steps li{display:grid;grid-template-columns:78px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:25px;font-size:11.5px}
.steps .t{font-family:var(--serif);font-size:10.5px;color:var(--ink4);white-space:nowrap}
.steps .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .s{font-size:10px;color:var(--ink4);white-space:nowrap}
.steps li.done .n{color:var(--ink4);text-decoration:line-through}
.steps li.done .t{color:var(--ink4);opacity:.8}
.steps li.next .n{color:var(--ink);font-weight:600}
.steps li.next .t{color:var(--warn);font-weight:600}
.steps li.next .s{color:var(--warn);font-weight:600}
.steps li.next .s::before{content:"●";font-size:7px;vertical-align:1px;margin-right:4px}

.empty-step{margin-top:8px;padding:9px 10px;border:1px dashed var(--fill2);border-radius:8px;font-size:10.5px;color:var(--ink4)}
.foot{display:flex;align-items:center;gap:2px;padding:8px 10px;border-top:1px solid var(--line)}
.foot .tab{flex:1;height:28px;border:0;background:transparent;color:var(--ink3);font-size:11px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:7px}
.foot .tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(14,22,19,.05)}
.foot .ic{width:28px;height:28px;display:grid;place-items:center;color:var(--ink3);border:0;background:transparent}
</style></head><body>

<article class="pcard">

  </div>

  </div>
  <div class="bar"><i style="width:50%"></i></div>
  <ul class="steps">
    <li class="done"><span class="t">10/19 18:00</span><span class="n">提测</span><span class="s"></span></li><li class="next"><span class="t">10/28 17:30</span><span class="n">发布</span><span class="s">10/28</span></li>

</article>
    <article class="pcard">
      <div class="pcard__top">
        <span class="pin" style="background:var(--fill2)"></span>
        <h3>团队周会改版</h3>
        <button class="more">⋯</button>
      </div>

        <span class="note">还没想清楚节奏</span>

    </article>
  </div>

  <div class="foot">
    <button class="tab"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 7h10.5M8.5 12h10.5M8.5 17h10.5M5 7h.01M5 12h.01M5 17h.01"/></svg>待办</button>

    <button class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg></button>

</div>
</body></html>
