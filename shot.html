<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截图</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c1f1a;
        color-scheme: dark;
      }
      html.is-live,
      html.is-live body,
      html.is-live #app,
      html.is-backdrop,
      html.is-backdrop body,
      html.is-backdrop #app {
        background: transparent;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      button,
      input {
        font-family: inherit;
      }
    </style>
    <script>
      const shotParams = new URLSearchParams(location.search);
      if (shotParams.get("live") === "1") {
        document.documentElement.classList.add("is-live");
      }
      if (shotParams.get("backdrop") === "1") {
        document.documentElement.classList.add("is-backdrop");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/shot.ts"></script>
  </body>
</html>
