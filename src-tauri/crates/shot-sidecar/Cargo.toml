[package]
name = "daodian-shot"
version = "0.4.1"
description = "到点截屏 sidecar"
edition = "2024"
publish = false

[lib]
name = "daodian_shot"
path = "src/lib.rs"

[[bin]]
name = "daodian-shot"
path = "src/main.rs"

[dependencies]
arboard = "3"
serde_json = "1"
shot-core = { path = "../shot-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
